name: release

on:
  push:
    tags:
      - "aissert--v*"
      - "!aissert--v*-SNAPSHOT*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: tag_version
        run: |
          version="${GITHUB_REF_NAME#aissert--v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync versions for release
        run: python3 scripts/sync_versions.py "${{ steps.tag_version.outputs.version }}"

      - name: Build plugin zip
        run: python3 scripts/build_plugin_zip.py

      - name: Check tag matches plugin version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          expected_tag="aissert--v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match plugin.json version ${version} (expected ${expected_tag})" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
