# Auto-bump per merge to main: scripts/bump_version.py picks the bump level
# from commit subjects since the last stable aissert--vX.Y.Z tag, commits the
# version bump, and pushes a
# matching release tag. The same workflow builds the plugin zip and publishes
# the GitHub Release; pushes made with GITHUB_TOKEN do not trigger follow-up
# push workflows, so release.yml is only for manually pushed stable tags.
#
# Guard: the bump commit itself starts with "chore(release):" — the job
# condition below skips re-running on that push, so the bump commit can't
# trigger an infinite bump loop.
#
# Snapshot releases from branches use snapshot-release.yml instead.
#
# Requires: main must accept direct pushes from the default GITHUB_TOKEN
# (no branch protection blocking the Actions bot), since this pushes a commit
# and a tag straight to main without a PR.
name: auto-release

on:
  push:
    branches: [main]

concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-tag-and-release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bump version from conventional commits
        id: bump
        run: |
          set +e
          new_version=$(python3 scripts/bump_version.py)
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "no commits since last tag, skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Commit bump and tag
        if: steps.bump.outputs.should_release == 'true'
        id: publish_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to ${{ steps.bump.outputs.new_version }}"
          tag_name="aissert--v${{ steps.bump.outputs.new_version }}"
          git tag -a "${tag_name}" -m "${tag_name}"
          git push origin main "${tag_name}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Build Claude plugin zip
        if: steps.bump.outputs.should_release == 'true'
        run: python3 scripts/build_claude_plugin_zip.py

      - name: Build Codex plugin zip
        if: steps.bump.outputs.should_release == 'true'
        run: python3 scripts/build_codex_plugin_zip.py

      - name: Create GitHub release
        if: steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.publish_tag.outputs.tag_name }}" dist/*.zip \
            --title "${{ steps.publish_tag.outputs.tag_name }}" \
            --generate-notes \
            --verify-tag
