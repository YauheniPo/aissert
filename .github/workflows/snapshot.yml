name: snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get current version from plugin.json
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          snapshot_version="${version}-SNAPSHOT"
          echo "snapshot_version=${snapshot_version}" >> "$GITHUB_OUTPUT"
          echo "Snapshot version: ${snapshot_version}"

      - name: Sync versions for snapshot build
        run: python3 scripts/sync_versions.py "${{ steps.version.outputs.snapshot_version }}"

      - name: Build plugin zip
        run: python3 scripts/build_plugin_zip.py

      - name: Restore original versions
        run: |
          git checkout .claude-plugin/plugin.json .claude-plugin/marketplace.json

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-build-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 30

      - name: Create or update snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="aissert--v${{ steps.version.outputs.snapshot_version }}"
          
          # Check if release exists
          if gh release view "${tag_name}" > /dev/null 2>&1; then
            echo "Snapshot release ${tag_name} already exists, skipping creation"
          else
            echo "Creating new snapshot release: ${tag_name}"
            gh release create "${tag_name}" dist/*.zip \
              --title "${tag_name} (PR #${{ github.event.pull_request.number }})" \
              --notes "Snapshot build from PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.head.sha }}" \
              --prerelease
          fi

      - name: Comment PR with snapshot info
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "aissert--v${{ steps.version.outputs.snapshot_version }}";
            const message = `## 📦 Snapshot Release\n\nSnapshot build created: [\`${tag}\`](https://github.com/${{ github.repository }}/releases/tag/${tag})\n\nDownload the plugin zip from the [release page](https://github.com/${{ github.repository }}/releases/tag/${tag}).`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
