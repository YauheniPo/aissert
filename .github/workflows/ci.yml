# CI per DESIGN.md §8: cheap checks on every PR. Canary eval (workflow_dispatch +
# weekly, costs API money) is a separate workflow, added in milestone 4.
# wiki-lint uses continue-on-error: informational only, never blocks a PR —
# see PROJECT_RULES.md's session-start wiki maintenance policy
# (commits/pushes are never blocked on wiki state).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Lint plugin manifests and frontmatter
        run: pytest tests/test_plugin_schema.py -q

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests
        run: pytest tests/ -q

  wiki-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wiki structural lint (informational, non-blocking)
        run: |
          set +e
          python3 scripts/wiki/lint.py
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Wiki structural lint reported informational issues (exit ${status}); see JSON output above."
          fi
